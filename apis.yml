name: Forty Seven 2
description: Forty Seven, Inc. was a clinical-stage immuno-oncology biopharmaceutical company
  developing therapies that target cancer immune-evasion pathways, based on technology licensed
  from Stanford University. Its lead program, magrolimab, was a monoclonal antibody against the
  CD47 "don't eat me" signal, evaluated in myelodysplastic syndrome, acute myeloid leukemia,
  non-Hodgkin lymphoma, and solid tumors. Seeded by Lightspeed Venture Partners in 2015, the
  company completed an IPO in 2018 and was acquired by Gilead Sciences in 2020 for approximately
  $4.9 billion, becoming a wholly-owned Gilead subsidiary. As a therapeutics developer it exposes
  no public developer platform, API, or SDK surface; its former site (fortyseveninc.com) now
  redirects to gilead.com.
